<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>SparkCrumb</title>

  <meta
    name="description"
    content="SparkCrumb — Drop a crumb. See what sparks."
  />

  <style>
    :root {
      --bg: #faf9f6;
      --bg-soft: #f7f4ee;

      --text: #191816;
      --muted: #6f6b64;

      --crumb: #b9a995;
      --crumb-hover: #9f8d78;

      --spark: #ee9837;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow: hidden;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% 42%,
          #fffdfa 0%,
          var(--bg) 54%,
          var(--bg-soft) 100%
        );

      color: var(--text);

      font-family:
        "Avenir Next",
        "Nunito Sans",
        "Segoe UI",
        ui-sans-serif,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      position: relative;
      flex: 1;

      display: grid;
      place-items: center;

      padding: 48px 24px;

      isolation: isolate;
    }


    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      position: relative;
      z-index: 10;

      text-align: center;

      pointer-events: none;
    }

    h1 {
      margin: 0;

      font-size: clamp(2.9rem, 7vw, 5.5rem);
      font-weight: 650;

      letter-spacing: -0.045em;
      line-height: 1;
    }

    .logo-spark {
      display: inline-block;

      margin-left: 0.12em;

      color: var(--spark);

      font-size: 0.66em;
      vertical-align: 0.14em;

      animation:
        logo-twinkle 4.2s ease-in-out infinite;
    }

    .tagline {
      margin: 30px 0 0;

      font-size: clamp(1.12rem, 2vw, 1.42rem);
      font-weight: 450;

      letter-spacing: -0.012em;
      line-height: 1.55;
    }


    /* =========================================================
       CLICKABLE CRUMBS
       ========================================================= */

    .crumb {
      position: absolute;
      z-index: 5;

      /*
        The visible crumb is intentionally tiny,
        but the actual click/tap target is 44px.
      */

      width: 44px;
      height: 44px;

      padding: 0;
      border: 0;

      background: transparent;

      display: grid;
      place-items: center;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;

      animation:
        crumb-drift 9s ease-in-out infinite;
    }

    .crumb::before {
      content: "";

      width: var(--crumb-size, 8px);
      height: var(--crumb-size, 8px);

      border-radius: 50%;

      background: var(--crumb);

      opacity: var(--crumb-opacity, 0.55);

      transition:
        width 180ms ease,
        height 180ms ease,
        background 180ms ease,
        opacity 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }


    /* A subtle clue that crumbs are interactive */

    .crumb:hover::before {
      background: var(--crumb-hover);

      opacity: 0.9;

      transform: scale(1.4);

      box-shadow:
        0 0 0 5px rgba(185, 169, 149, 0.08);
    }

    .crumb:focus-visible {
      outline: none;
    }

    .crumb:focus-visible::before {
      box-shadow:
        0 0 0 5px rgba(238, 152, 55, 0.18);
    }


    /* =========================================================
       CRUMB POSITIONS

       Mostly around the outer parts of the page,
       with only two closer to the center.
       ========================================================= */


    /* far upper-left */

    .crumb.c1 {
      top: 15%;
      left: 7%;

      --crumb-size: 7px;
      --crumb-opacity: 0.52;

      animation-delay: -2s;
      animation-duration: 9.5s;
    }


    /* far lower-left */

    .crumb.c2 {
      top: 76%;
      left: 10%;

      --crumb-size: 10px;
      --crumb-opacity: 0.48;

      animation-delay: -5s;
      animation-duration: 11s;
    }


    /* far upper-right */

    .crumb.c3 {
      top: 13%;
      right: 8%;

      --crumb-size: 6px;
      --crumb-opacity: 0.46;

      animation-delay: -3.2s;
      animation-duration: 8.7s;
    }


    /* far lower-right */

    .crumb.c4 {
      top: 78%;
      right: 7%;

      --crumb-size: 8px;
      --crumb-opacity: 0.55;

      animation-delay: -6s;
      animation-duration: 10.3s;
    }


    /* mid-right */

    .crumb.c5 {
      top: 52%;
      right: 18%;

      --crumb-size: 6px;
      --crumb-opacity: 0.42;

      animation-delay: -1.4s;
      animation-duration: 9.1s;
    }


    /* mid-left */

    .crumb.c6 {
      top: 43%;
      left: 18%;

      --crumb-size: 5px;
      --crumb-opacity: 0.42;

      animation-delay: -4.8s;
      animation-duration: 10.7s;
    }


    /* =========================================================
       DECORATIVE SPARKS
       ========================================================= */

    .tiny-spark {
      position: absolute;
      z-index: 2;

      color: var(--spark);

      line-height: 1;
      opacity: 0.5;

      pointer-events: none;

      animation:
        spark-twinkle 5.2s ease-in-out infinite;
    }


    /* left upper */

    .tiny-spark.s1 {
      top: 31%;
      left: 12%;

      font-size: 17px;
      opacity: 0.58;

      animation-delay: -1.3s;
    }


    /* left lower */

    .tiny-spark.s2 {
      bottom: 20%;
      left: 30%;

      font-size: 11px;
      opacity: 0.36;

      animation-delay: -3.6s;
    }


    /* right upper */

    .tiny-spark.s3 {
      top: 27%;
      right: 13%;

      font-size: 15px;
      opacity: 0.47;

      animation-delay: -2.1s;
    }


    /* right lower */

    .tiny-spark.s4 {
      bottom: 18%;
      right: 28%;

      font-size: 10px;
      opacity: 0.34;

      animation-delay: -4.4s;
    }


    /* =========================================================
       SPARK CREATED AFTER CLICK
       ========================================================= */

    .crumb-spark {
      position: fixed;
      z-index: 100;

      width: 44px;
      height: 44px;

      margin-left: -22px;
      margin-top: -22px;

      display: grid;
      place-items: center;

      color: var(--spark);

      font-size: 31px;
      line-height: 1;

      pointer-events: none;

      filter:
        drop-shadow(
          0 2px 8px
          rgba(238, 152, 55, 0.28)
        );

      animation:
        clicked-spark
        850ms
        cubic-bezier(.2, .8, .3, 1)
        forwards;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      position: relative;
      z-index: 10;

      padding:
        0
        24px
        30px;

      text-align: center;

      color: var(--muted);

      font-size: 0.95rem;
      font-weight: 450;

      letter-spacing: 0.005em;
    }


    /* =========================================================
       ANIMATIONS
       ========================================================= */


    /*
      Crumbs wander slightly.

      Larger movement than the previous version,
      so they feel scattered rather than attached
      to the logo.
    */

    @keyframes crumb-drift {
      0%,
      100% {
        transform:
          translate(0, 0)
          rotate(0deg);
      }

      30% {
        transform:
          translate(9px, -10px)
          rotate(4deg);
      }

      65% {
        transform:
          translate(-6px, -17px)
          rotate(-5deg);
      }

      82% {
        transform:
          translate(4px, -8px)
          rotate(2deg);
      }
    }


    /*
      Existing sparks breathe quietly.
    */

    @keyframes spark-twinkle {
      0%,
      100% {
        opacity: 0.3;

        transform:
          scale(0.82)
          rotate(-5deg);
      }

      45% {
        opacity: 0.85;

        transform:
          scale(1.14)
          rotate(5deg);
      }

      68% {
        opacity: 0.55;

        transform:
          scale(0.96)
          rotate(1deg);
      }
    }


    /*
      Spark beside the SparkCrumb wordmark.
    */

    @keyframes logo-twinkle {
      0%,
      100% {
        opacity: 0.76;

        transform:
          scale(0.94)
          rotate(5deg);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.08)
          rotate(-3deg);
      }
    }


    /*
      Spark created when a crumb is clicked.

      Pop → glow → float upward → disappear.
    */

    @keyframes clicked-spark {
      0% {
        opacity: 0;

        transform:
          translateY(5px)
          scale(0.15)
          rotate(-18deg);
      }

      22% {
        opacity: 1;

        transform:
          translateY(-2px)
          scale(1.45)
          rotate(9deg);
      }

      52% {
        opacity: 1;

        transform:
          translateY(-7px)
          scale(1.05)
          rotate(-4deg);
      }

      78% {
        opacity: 0.7;

        transform:
          translateY(-14px)
          scale(0.92)
          rotate(5deg);
      }

      100% {
        opacity: 0;

        transform:
          translateY(-24px)
          scale(0.55)
          rotate(13deg);
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      h1 {
        font-size:
          clamp(2.75rem, 14vw, 4rem);
      }

      .tagline {
        margin-top: 24px;
      }


      /*
        Keep crumbs around the edges on mobile too,
        but not so close that their 44px tap target
        extends far off-screen.
      */

      .crumb.c1 {
        top: 14%;
        left: 1%;
      }

      .crumb.c2 {
        top: 76%;
        left: 3%;
      }

      .crumb.c3 {
        top: 12%;
        right: 1%;
      }

      .crumb.c4 {
        top: 77%;
        right: 2%;
      }

      .crumb.c5 {
        top: 54%;
        right: 8%;
      }

      .crumb.c6 {
        top: 41%;
        left: 7%;
      }


      /* sparks */

      .tiny-spark.s1 {
        top: 28%;
        left: 8%;

        font-size: 15px;
      }

      .tiny-spark.s2 {
        bottom: 18%;
        left: 25%;
      }

      .tiny-spark.s3 {
        top: 25%;
        right: 8%;
      }

      .tiny-spark.s4 {
        bottom: 16%;
        right: 21%;
      }


      footer {
        padding-bottom: 24px;
      }
    }

  </style>
</head>


<body>

  <main>


    <!-- =====================================================
         CLICKABLE CRUMBS
         ===================================================== -->

    <button
      class="crumb c1"
      type="button"
      aria-label="Spark this crumb"
    ></button>

    <button
      class="crumb c2"
      type="button"
      aria-label="Spark this crumb"
    ></button>

    <button
      class="crumb c3"
      type="button"
      aria-label="Spark this crumb"
    ></button>

    <button
      class="crumb c4"
      type="button"
      aria-label="Spark this crumb"
    ></button>

    <button
      class="crumb c5"
      type="button"
      aria-label="Spark this crumb"
    ></button>

    <button
      class="crumb c6"
      type="button"
      aria-label="Spark this crumb"
    ></button>


    <!-- =====================================================
         DECORATIVE SPARKS
         ===================================================== -->

    <span
      class="tiny-spark s1"
      aria-hidden="true"
    >✦</span>

    <span
      class="tiny-spark s2"
      aria-hidden="true"
    >✦</span>

    <span
      class="tiny-spark s3"
      aria-hidden="true"
    >✦</span>

    <span
      class="tiny-spark s4"
      aria-hidden="true"
    >✦</span>


    <!-- =====================================================
         BRAND
         ===================================================== -->

    <section
      class="brand"
      aria-label="SparkCrumb"
    >

      <h1>
        SparkCrumb<span
          class="logo-spark"
          aria-hidden="true"
        >✦</span>
      </h1>

      <p class="tagline">
        Drop a crumb. See what sparks.
      </p>

    </section>

  </main>


  <footer>
    © 2026 SparkCrumb
  </footer>


  <script>

    const crumbs =
      document.querySelectorAll(".crumb");


    function sparkCrumb(crumb) {

      /*
        Determine where the clicked crumb is
        right now, including its drifting movement.
      */

      const rect =
        crumb.getBoundingClientRect();

      const x =
        rect.left + rect.width / 2;

      const y =
        rect.top + rect.height / 2;


      /*
        Create the temporary spark.
      */

      const spark =
        document.createElement("span");

      spark.className =
        "crumb-spark";

      spark.textContent =
        "✦";

      spark.setAttribute(
        "aria-hidden",
        "true"
      );

      spark.style.left =
        `${x}px`;

      spark.style.top =
        `${y}px`;

      document.body.appendChild(spark);


      /*
        Give the clicked crumb
        a tiny playful response.
      */

      crumb.animate(
        [
          {
            transform:
              "scale(1)"
          },

          {
            transform:
              "scale(0.62)",

            offset: 0.25
          },

          {
            transform:
              "scale(1.24)",

            offset: 0.58
          },

          {
            transform:
              "scale(1)"
          }
        ],

        {
          duration: 420,
          easing: "ease-out"
        }
      );


      /*
        Remove the temporary spark when
        its animation finishes.
      */

      spark.addEventListener(
        "animationend",

        () => spark.remove(),

        {
          once: true
        }
      );

    }


    crumbs.forEach((crumb) => {

      crumb.addEventListener(
        "click",

        () => {
          sparkCrumb(crumb);
        }
      );

    });

  </script>

</body>
</html>
