<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>SparkCrumb</title>

  <meta
    name="description"
    content="SparkCrumb — Drop a crumb. See what sparks."
  />

  <style>
    :root {
      --bg: #faf9f6;
      --bg-soft: #f7f4ee;

      --text: #191816;
      --muted: #6f6b64;

      --crumb: #b9a995;
      --spark: #ee9837;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow: hidden;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% 42%,
          #fffdfa 0%,
          var(--bg) 54%,
          var(--bg-soft) 100%
        );

      color: var(--text);

      font-family:
        "Avenir Next",
        "Nunito Sans",
        "Segoe UI",
        ui-sans-serif,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =========================================================
       Main
       ========================================================= */

    main {
      position: relative;
      flex: 1;

      display: grid;
      place-items: center;

      padding: 48px 24px;

      isolation: isolate;
    }


    /* =========================================================
       Brand
       ========================================================= */

    .brand {
      position: relative;
      z-index: 10;

      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: clamp(2.9rem, 7vw, 5.5rem);
      font-weight: 650;

      letter-spacing: -0.045em;
      line-height: 1;
    }

    .logo-spark {
      display: inline-block;

      margin-left: 0.12em;

      color: var(--spark);

      font-size: 0.66em;
      vertical-align: 0.14em;

      animation:
        logo-twinkle 4.2s ease-in-out infinite;
    }

    .tagline {
      margin: 30px 0 0;

      font-size: clamp(1.12rem, 2vw, 1.42rem);
      font-weight: 450;

      letter-spacing: -0.012em;
      line-height: 1.55;
    }


    /* =========================================================
       Crumbs
       ========================================================= */

    .crumb {
      position: absolute;
      z-index: 1;

      border-radius: 50%;

      background: var(--crumb);

      opacity: 0.56;

      animation:
        crumb-drift 8s ease-in-out infinite;
    }

    /* upper left */
    .crumb.c1 {
      top: 23%;
      left: 17%;

      width: 7px;
      height: 7px;

      animation-delay: -2s;
    }

    /* lower left */
    .crumb.c2 {
      top: 69%;
      left: 23%;

      width: 10px;
      height: 10px;

      opacity: 0.48;

      animation-delay: -5s;
    }

    /* upper right */
    .crumb.c3 {
      top: 20%;
      right: 18%;

      width: 6px;
      height: 6px;

      opacity: 0.48;

      animation-delay: -3.2s;
    }

    /* lower right */
    .crumb.c4 {
      top: 72%;
      right: 18%;

      width: 8px;
      height: 8px;

      animation-delay: -6s;
    }

    /* a tiny extra crumb */
    .crumb.c5 {
      top: 58%;
      right: 10%;

      width: 5px;
      height: 5px;

      opacity: 0.38;

      animation-delay: -1.4s;
    }


    /* =========================================================
       Decorative Sparks
       ========================================================= */

    .tiny-spark {
      position: absolute;
      z-index: 2;

      color: var(--spark);

      line-height: 1;

      opacity: 0.5;

      animation:
        spark-twinkle 5.2s ease-in-out infinite;
    }

    /* LEFT — main visible spark */
    .tiny-spark.s1 {
      top: 37%;
      left: 13%;

      font-size: 17px;

      opacity: 0.58;

      animation-delay: -1.3s;
    }

    /* LEFT — smaller lower spark */
    .tiny-spark.s2 {
      bottom: 26%;
      left: 31%;

      font-size: 11px;

      opacity: 0.36;

      animation-delay: -3.6s;
    }

    /* RIGHT — upper spark */
    .tiny-spark.s3 {
      top: 27%;
      right: 11%;

      font-size: 15px;

      opacity: 0.47;

      animation-delay: -2.1s;
    }

    /* RIGHT — tiny lower spark */
    .tiny-spark.s4 {
      bottom: 20%;
      right: 29%;

      font-size: 9px;

      opacity: 0.32;

      animation-delay: -4.4s;
    }


    /* =========================================================
       Magic Crumb
       One crumb occasionally turns into a spark.
       ========================================================= */

    .magic {
      position: absolute;
      z-index: 3;

      top: 35%;
      right: 28%;

      width: 14px;
      height: 14px;

      animation:
        magic-hop 7s ease-in-out infinite;
    }

    .magic::before {
      content: "•";

      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      color: var(--crumb);

      font-size: 23px;
      line-height: 1;

      animation:
        crumb-fade 7s ease-in-out infinite;
    }

    .magic::after {
      content: "✦";

      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      color: var(--spark);

      font-size: 22px;
      line-height: 1;

      opacity: 0;

      animation:
        spark-appear 7s ease-in-out infinite;
    }


    /* =========================================================
       Footer
       ========================================================= */

    footer {
      position: relative;
      z-index: 10;

      padding: 0 24px 30px;

      text-align: center;

      color: var(--muted);

      font-size: 0.95rem;
      font-weight: 450;

      letter-spacing: 0.005em;
    }


    /* =========================================================
       Animations
       ========================================================= */

    @keyframes crumb-drift {
      0%,
      100% {
        transform:
          translate(0, 0)
          rotate(0deg);
      }

      35% {
        transform:
          translate(5px, -7px)
          rotate(5deg);
      }

      70% {
        transform:
          translate(-3px, -12px)
          rotate(-4deg);
      }
    }


    @keyframes spark-twinkle {
      0%,
      100% {
        opacity: 0.3;

        transform:
          scale(0.82)
          rotate(-5deg);
      }

      45% {
        opacity: 0.85;

        transform:
          scale(1.14)
          rotate(5deg);
      }

      68% {
        opacity: 0.55;

        transform:
          scale(0.96)
          rotate(1deg);
      }
    }


    @keyframes logo-twinkle {
      0%,
      100% {
        opacity: 0.76;

        transform:
          scale(0.94)
          rotate(5deg);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.08)
          rotate(-3deg);
      }
    }


    /* Little hop when the crumb sparks */
    @keyframes magic-hop {
      0%,
      43%,
      100% {
        transform:
          translate(0, 0);
      }

      53% {
        transform:
          translate(0, -3px);
      }

      61% {
        transform:
          translate(3px, -9px);
      }

      70% {
        transform:
          translate(5px, -12px);
      }

      80% {
        transform:
          translate(5px, -10px);
      }
    }


    @keyframes crumb-fade {
      0%,
      43% {
        opacity: 0.72;

        transform:
          scale(1);
      }

      50% {
        opacity: 0;

        transform:
          scale(0.42);
      }

      78% {
        opacity: 0;

        transform:
          scale(0.42);
      }

      89%,
      100% {
        opacity: 0.72;

        transform:
          scale(1);
      }
    }


    @keyframes spark-appear {
      0%,
      46% {
        opacity: 0;

        transform:
          scale(0.3)
          rotate(-20deg);
      }

      55% {
        opacity: 1;

        transform:
          scale(1.22)
          rotate(8deg);
      }

      66% {
        opacity: 0.9;

        transform:
          scale(1)
          rotate(0deg);
      }

      76% {
        opacity: 0;

        transform:
          scale(0.65)
          rotate(14deg);
      }

      100% {
        opacity: 0;
      }
    }


    /* =========================================================
       Mobile
       ========================================================= */

    @media (max-width: 600px) {

      .crumb.c1 {
        left: 9%;
      }

      .crumb.c2 {
        left: 14%;
      }

      .crumb.c3 {
        right: 10%;
      }

      .crumb.c4 {
        right: 9%;
      }

      .crumb.c5 {
        display: none;
      }

      .tiny-spark.s1 {
        top: 32%;
        left: 8%;
      }

      .tiny-spark.s2 {
        bottom: 23%;
        left: 20%;
      }

      .tiny-spark.s3 {
        top: 25%;
        right: 7%;
      }

      .tiny-spark.s4 {
        right: 18%;
      }

      .magic {
        top: 34%;
        right: 17%;
      }
    }


    /* =========================================================
       Reduced motion

       Keep SparkCrumb visually alive without floating movement.
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .crumb {
        animation: none;
      }

      .tiny-spark,
      .logo-spark {
        animation-duration: 8s;
        animation-timing-function: ease-in-out;
      }

      .magic {
        animation: none;
      }

      .magic::before {
        animation: none;
        opacity: 0.65;
      }

      .magic::after {
        animation: none;
        opacity: 0;
      }
    }

  </style>
</head>


<body>

  <main>

    <!-- Crumbs -->
    <span class="crumb c1" aria-hidden="true"></span>
    <span class="crumb c2" aria-hidden="true"></span>
    <span class="crumb c3" aria-hidden="true"></span>
    <span class="crumb c4" aria-hidden="true"></span>
    <span class="crumb c5" aria-hidden="true"></span>


    <!-- Sparks -->
    <span class="tiny-spark s1" aria-hidden="true">✦</span>
    <span class="tiny-spark s2" aria-hidden="true">✦</span>
    <span class="tiny-spark s3" aria-hidden="true">✦</span>
    <span class="tiny-spark s4" aria-hidden="true">✦</span>


    <!--
      The little Easter egg:
      one crumb occasionally becomes a spark.
    -->
    <span class="magic" aria-hidden="true"></span>


    <!-- Brand -->
    <section class="brand" aria-label="SparkCrumb">

      <h1>
        SparkCrumb<span
          class="logo-spark"
          aria-hidden="true"
        >✦</span>
      </h1>

      <p class="tagline">
        Drop a crumb. See what sparks.
      </p>

    </section>

  </main>


  <footer>
    © 2026 SparkCrumb
  </footer>

</body>
</html>
